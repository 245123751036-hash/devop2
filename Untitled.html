<!DOCTYPE html>
<html>
<head>
    <title>Voter Registration Form</title>
    <style>
        h1 {
            color: green;
            text-align: center;
        }
        h2 {
            color: blue;
            text-align: center;
        }
        p {
            color: red;
        }
        table {
            background-color: cyan;
        }
        td {
           
            color: blue;
            font-size: 24px;
        }
        input, textarea {
            color: blue;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>

<body style=" background-color:lightgreen;">

<h2>Voter Registration Form</h2>

<form>
    <table border="5" align="center" cellspacing="10" cellpadding="10">
        <tr style=" background-color: pink;">
            <td>Name</td>
            <td><input type="text"></td>
        </tr>

        <tr style=" background-color:teal;">
            <td>Gender</td>
            <td>
                <input type="radio" name="g"> Male
                <input type="radio" name="g"> Female
            </td>
        </tr>

        <tr style=" background-color:white;">
            <td>Address</td>
            <td><textarea rows="5" cols="15"></textarea></td>
        </tr>

        <tr style=" background-color:skyblue;">
            <td>Date of Birth</td>
            <td><input type="date"></td>
        </tr>

        <tr style=" background-color:grey;">
            <td>Father Name</td>
            <td><input type="text"></td>
        </tr>

        <tr style=" background-color:yellow;">
            <td>Mother Name</td>
            <td><input type="text"></td>
        </tr>

        <tr style=" background-color:violet;">
            <td>Contact Number</td>
            <td><input type="text"></td>
        </tr>
          <tr style=" background-color:olive;">
            <td>adhar Number</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Register">
                <input type="reset" value="Clear">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
